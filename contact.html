<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Контакты продавца — Toyota Camry 2022</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      color: #333;
      line-height: 1.6;
      margin: 0;
      padding: 0;
      background: #f5f5f5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }

    .contact-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      margin: 3rem 0;
    }

    .contact-info, .map-section {
      background: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #2c3e50;
      margin-bottom: 1.5rem;
    }

    .phone {
      font-size: 1.5rem;
      font-weight: bold;
      color: #e74c3c;
      margin: 1rem 0;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #e74c3c;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      margin: 0.5rem 0;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #c0392b;
    }

    #map {
      width: 100%;
      height: 400px;
      border-radius: 8px;
      border: 1px solid #ddd;
    }

    footer {
      text-align: center;
      padding: 2rem;
      background: #2c3e50;
      color: white;
      margin-top: 3rem;
    }

    @media (max-width: 768px) {
      .contact-section {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <script>
    function initMap() {
      const sellerLocation = { lat: 55.7558, lng: 37.6173 }; // Москва
      const map = new google.maps.Map(document.getElementById("map"), {
        center: sellerLocation,
        zoom: 14,
      });
      new google.maps.Marker({
        position: sellerLocation,
        map: map,
        title: "Местонахождение продавца",
      });
    }
  </script>
  <script async defer src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap"></script>
</head>
<body>
  <div class="container">
    <h1>Контакты продавца</h1>
    <div class="contact-section">
      <div class="contact-info">
        <h2>Информация о продавце</h2>
        <p><strong>Имя:</strong> Иван Петров</p>
        <p class="phone">+7 (999) 123-45-67</p>
        <p><strong>Email:</strong> auto@example.com</p>
        <p><strong>Адрес:</strong> г. Москва, ул. Примерная, д. 15</p>
        <a href="tel:+79991234567" class="btn">Позвонить сейчас</a>
        <a href="https://wa.me/79991234567" target="_blank" class="btn" style="background: #25D366;">Написать в WhatsApp</a>
        <a href="mailto:auto@example.com" class="btn" style="background: #4285F4;">Написать на email</a>
      </div>
      <div class="map-section">
        <h2>Местонахождение продавца</h2>
        <div id="map"></div>
      </div>
    </div>
  </div>
  <footer>
    <p>&copy; 2024 Продажа автомобилей. Все права защищены.</p>
  </footer>
</body>
</html>
